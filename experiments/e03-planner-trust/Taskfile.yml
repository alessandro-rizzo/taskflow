version: "3"

env:
  PYTHONDONTWRITEBYTECODE: "1"

tasks:
  check:
    desc: Verify the result-free E03 Phase A contract
    cmds:
      - task: check:contract

  check:contract:
    desc: Verify protocol, bindings, thresholds, wrappers, and Phase A boundary
    cmds:
      - python3 scripts/verify_contract.py --phase-a-only
      - python3 -m unittest discover -s tests -v
