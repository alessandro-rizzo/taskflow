version: "3"

tasks:
  check:
    desc: Verify the frozen E05 Phase A contract
    cmds:
      - task: check:phase-a

  check:phase-a:
    desc: Verify Phase A artifacts and rejection tests without running Phase B
    cmds:
      - python3 scripts/verify_contract.py
      - python3 -m unittest discover -s tests -v
