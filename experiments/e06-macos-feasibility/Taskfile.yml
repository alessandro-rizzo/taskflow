version: "3"

tasks:
  check:phase-a:
    desc: Verify the frozen E06 inventory and predeclared measurement contract
    cmds:
      - env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - env PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_contract.py

  inventory:print:
    desc: Print a sanitized read-only inventory without modifying host state
    cmds:
      - env PYTHONDONTWRITEBYTECODE=1 python3 scripts/collect_inventory.py
