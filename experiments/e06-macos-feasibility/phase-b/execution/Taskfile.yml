version: '3'

tasks:
  verify:
    cmds:
      - PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_execution.py
  test:
    cmds:
      - PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py'
  record-plan:
    cmds:
      - PYTHONDONTWRITEBYTECODE=1 python3 scripts/runner.py --record-plan
  check:
    cmds:
      - task: verify
      - task: test
      - task: record-plan
