version: "3"

tasks:
  check:
    desc: Verify the result-free E06 Phase-B execution contract
    cmds:
      - env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - env PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_phase_b.py
      - env PYTHONDONTWRITEBYTECODE=1 python3 scripts/guard.py --dry-run
      - env PYTHONDONTWRITEBYTECODE=1 python3 scripts/runner.py --describe
