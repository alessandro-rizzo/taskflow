version: "3"

tasks:
  check:
    desc: Run the implemented E01 candidate gates
    cmds:
      - task: check:a
      - task: check:b
      - task: check:c
      - task: check:d
      - task: check:tf00307

  check:a:
    desc: Verify standalone candidate A, then compare its completed outputs
    cmds:
      - task --dir candidates/a-explicit-go check
      - python3 scripts/verify-candidate-a.py

  check:b:
    desc: Verify standalone candidate B and compare A/B completed outputs
    cmds:
      - task --dir candidates/b-generated-go check
      - python3 scripts/verify-candidate-b.py

  check:c:
    desc: Verify standalone candidate C and compare A/B/C completed outputs
    cmds:
      - task --dir candidates/c-reflection-go check
      - python3 scripts/verify-candidate-c.py

  check:d:
    desc: Verify standalone candidate D and compare all completed outputs
    cmds:
      - task --dir candidates/d-typescript check
      - python3 scripts/verify-candidate-d.py

  check:phase-a:
    desc: Historical pre-candidate Phase A verification; fails once candidates exist
    cmds:
      - python3 scripts/verify-phase-a.py
      - task: validate:effect-probe

  validate:effect-probe:
    desc: Validate the synthetic effect schema through the frozen T1 harness
    dir: ../../fixtures/t1-plan-conformance
    cmds:
      - >-
        go run ./cmd/t1conform
        --candidate ../../experiments/e01-authoring-schema/scope/effect-probe.schema.json
        --golden ../../experiments/e01-authoring-schema/scope/effect-probe.schema.json

  check:tf00307:
    desc: Verify frozen E01 measurements, agent trials, scorecard, and decision
    cmds:
      - python3 measurements/scripts/verify_protocol.py
      - python3 measurements/scripts/audit_candidates.py
      - python3 agent-trials/scripts/verify_trials.py
      - python3 measurements/scripts/verify_results.py
