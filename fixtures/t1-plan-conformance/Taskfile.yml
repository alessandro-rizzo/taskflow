version: "3"

tasks:
  fmt:check:
    desc: Verify Go source formatting
    cmds:
      - |
        files="$(gofmt -l .)"
        test -z "$files" || {
          printf '%s\n' "$files"
          exit 1
        }

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  lint:
    desc: Run the standard Go static checks
    cmds:
      - go vet ./...

  build:
    desc: Build the t1conform CLI
    cmds:
      - go build -o bin/t1conform ./cmd/t1conform

  check:
    desc: Run formatting, tests, static checks, and a build (this fixture's own verification command)
    deps: [fmt:check, test, lint]
    cmds:
      - task: build
