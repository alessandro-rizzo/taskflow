version: "3"

tasks:
  check:
    desc: Verify every maintained implementation in the repository
    cmds:
      - task: prototype:check

  prototype:check:
    desc: Run the complete architecture-bootstrap prototype gate
    dir: prototype/bootstrap
    cmds:
      - task check

  prototype:example:
    desc: Run the architecture-bootstrap prototype example
    dir: prototype/bootstrap
    cmds:
      - task example
